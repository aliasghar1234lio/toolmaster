<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ToolMaster Word Counter</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:24px;font-family:Arial,sans-serif;background:#f3f5ff;color:#182230}main{max-width:760px;margin:30px auto;background:white;padding:28px;border-radius:18px;box-shadow:0 8px 28px #17255418}h1{color:#4f46e5;margin-top:0}textarea{display:block;width:100%;min-height:220px;padding:14px;border:1px solid #cbd5e1;border-radius:10px;font:16px/1.5 Arial,sans-serif;resize:vertical}.stats{display:flex;flex-wrap:wrap;gap:12px;margin:18px 0}.stat{flex:1 1 140px;padding:16px;border-radius:12px;background:#eef2ff}.number{display:block;font-size:28px;font-weight:bold;color:#4338ca;margin-top:6px}button{border:0;border-radius:8px;padding:11px 18px;margin:0 8px 8px 0;cursor:pointer;font-size:15px;background:#4f46e5;color:white}button.secondary{background:#e2e8f0;color:#182230}.hint{color:#64748b;font-size:14px}@media(max-width:480px){body{padding:12px}main{margin:8px auto;padding:18px}}
</style>
</head>
<body>
<main>
<h1>ToolMaster</h1><h2>Free Word Counter</h2>
<p>Type or paste your text below. Counts update automatically.</p>
<textarea id="textInput" placeholder="Start typing here..."></textarea>
<div class="stats" aria-live="polite">
<div class="stat">Words <span class="number" id="words">0</span></div>
<div class="stat">Characters <span class="number" id="chars">0</span></div>
<div class="stat">Characters (without spaces) <span class="number" id="charsNoSpaces">0</span></div>
<div class="stat">Sentences <span class="number" id="sentences">0</span></div>
</div>
<button id="copyBtn" type="button">Copy Text</button><button id="clearBtn" class="secondary" type="button">Clear</button>
<p class="hint">Free tool • Works on mobile and desktop</p>
</main>
<script>
(function(){
const input=document.getElementById('textInput'),words=document.getElementById('words'),chars=document.getElementById('chars'),charsNoSpaces=document.getElementById('charsNoSpaces'),sentences=document.getElementById('sentences');
function updateCounts(){const text=input.value,trimmed=text.trim();words.textContent=trimmed?trimmed.split(/\s+/).length:0;chars.textContent=text.length;charsNoSpaces.textContent=text.replace(/\s/g,'').length;const matches=trimmed.match(/[^.!?]+[.!?]+|[^.!?]+$/g);sentences.textContent=matches?matches.filter(s=>s.trim()).length:0;}
input.addEventListener('input',updateCounts);
document.getElementById('clearBtn').addEventListener('click',function(){input.value='';updateCounts();input.focus();});
document.getElementById('copyBtn').addEventListener('click',async function(){try{await navigator.clipboard.writeText(input.value);alert('Text copied!');}catch(e){input.select();const ok=document.execCommand('copy');alert(ok?'Text copied!':'Please copy the selected text using Ctrl+C.');}});
updateCounts();
})();
</script>
</body></html>
